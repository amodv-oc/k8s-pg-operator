# Complete nginx configuration for the pg-operator dashboard container.
#
# It replaces the base image's nginx.conf outright, for two reasons: the pod
# runs this container with readOnlyRootFilesystem and as uid 65532, so every
# path nginx writes to has to be moved under /tmp and the `user` directive has
# to go; and the base image's entrypoint templating would need to write into
# /etc/nginx, which it cannot.

worker_processes auto;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Writable paths, all under the in-memory /tmp the pod mounts for this
    # container. Without these nginx tries /var/cache/nginx and fails to start.
    client_body_temp_path /tmp/nginx-client-body;
    proxy_temp_path /tmp/nginx-proxy;
    fastcgi_temp_path /tmp/nginx-fastcgi;
    uwsgi_temp_path /tmp/nginx-uwsgi;
    scgi_temp_path /tmp/nginx-scgi;

    log_format concise '$remote_addr "$request" $status $body_bytes_sent ${request_time}s';
    access_log /dev/stdout concise;

    sendfile on;
    tcp_nopush on;
    server_tokens off;
    keepalive_timeout 65;
    client_max_body_size 1m;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Cache policy as a map rather than per-location `add_header`, because an
    # add_header in a location replaces the server-level ones rather than
    # adding to them - which would silently drop the security headers below on
    # exactly the paths that set their own caching.
    map $uri $pgop_cache {
        default                        "no-store";
        ~^/assets/                     "public, max-age=31536000, immutable";
        ~*\.(svg|png|ico|webp|woff2)$  "public, max-age=86400";
    }

    server {
        listen 8081;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;

        add_header Cache-Control $pgop_cache always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy no-referrer always;

        # This container's own liveness. Deliberately not proxied: the probe
        # must report on nginx, not on the API container next to it.
        location = /nginx-healthz {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }

        # Runtime settings. The chart mounts a ConfigMap over this directory,
        # which shadows the default baked into the image. A 404 here is fine -
        # the app falls back to its built-in defaults.
        location = /config.json {
            root /etc/pg-operator-ui;
            default_type application/json;
        }

        # --- the state API, on loopback in this pod ------------------------
        location /api/ {
            include /etc/nginx/api-proxy.conf;
        }

        location = /readyz {
            include /etc/nginx/api-proxy.conf;
        }

        location = /healthz {
            include /etc/nginx/api-proxy.conf;
        }

        location = /openapi.json {
            include /etc/nginx/api-proxy.conf;
        }

        location /docs {
            include /etc/nginx/api-proxy.conf;
        }

        location /redoc {
            include /etc/nginx/api-proxy.conf;
        }

        # --- the bundle ----------------------------------------------------
        # Hashed filenames, so a miss is a genuine 404 rather than a route.
        location /assets/ {
            try_files $uri =404;
        }

        # Every other path is a client-side route: serving index.html is what
        # makes a deep link such as /databases/team-a/orders survive a reload.
        location / {
            try_files $uri /index.html;
        }
    }
}
