# Proxy settings for the state API, which runs as a sibling container in the
# same pod. Included by each proxied location so they cannot drift apart.
proxy_pass http://127.0.0.1:8000;
# No rewrite: the FastAPI routes are already prefixed /api/v1, and /readyz,
# /healthz and /docs sit at its root.
proxy_http_version 1.1;
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header Connection "";
proxy_connect_timeout 5s;
proxy_read_timeout 30s;
# The API answers 503 with the reason the cluster is unreachable, and 404 for a
# resource that does not exist. Both are the answer, not a broken upstream, so
# nginx must pass them through rather than swallow them.
proxy_intercept_errors off;
