name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  UV_VERSION: "0.12.10"
  REGISTRY: ghcr.io
  # ghcr.io/<owner>/<repo> and ghcr.io/<owner>/<repo>-ui
  IMAGE_NAME: ${{ github.repository }}
  UI_IMAGE_NAME: ${{ github.repository }}-ui

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv sync --extra dev
      - name: Ruff
        run: uv run ruff check --output-format github src tests
      - name: mypy
        run: uv run mypy src/pg_operator

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 14 predates the PostgreSQL 16 role-grant changes; 15 locks down the
        # public schema; 16 and 17 need explicit INHERIT/SET on role grants.
        postgres: ["14", "15", "16", "17", "18"]
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}-alpine
        env:
          POSTGRES_PASSWORD: testpw
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv sync --extra dev

      - name: Create an RDS-like managing role
        # Not a superuser: a member of rds_superuser holding CREATEDB and
        # CREATEROLE, which is what the RDS master user actually is.
        env:
          PGPASSWORD: testpw
        run: |
          psql -h localhost -U postgres -c "CREATE ROLE rds_superuser NOLOGIN"
          psql -h localhost -U postgres -c \
            "CREATE ROLE pgadmin LOGIN PASSWORD 'adminpw' CREATEDB CREATEROLE"
          psql -h localhost -U postgres -c "GRANT rds_superuser TO pgadmin"

      - name: Tests
        env:
          PGOP_TEST_DSN: "host=localhost port=5432 user=pgadmin password=adminpw dbname=postgres sslmode=disable"
        run: uv run pytest --cov=pg_operator --cov-report=term-missing

  ui:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci
      - name: ESLint
        run: npm run lint
      - name: Build
        run: npm run build

  chart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-helm@v5
      - name: helm lint
        run: helm lint charts/pg-operator
      - name: Render defaults
        run: helm template test charts/pg-operator --namespace pg-operator
      - name: Render every optional feature
        run: |
          helm template test charts/pg-operator --namespace pg-operator \
            --set replicaCount=2 --set peering.enabled=true \
            --set metrics.serviceMonitor.enabled=true \
            --set podDisruptionBudget.enabled=true \
            --set networkPolicy.enabled=true \
            --set api.ingress.enabled=true \
            --set rbac.namespacedSecrets=true \
            --set 'rbac.secretNamespaces={team-a,team-b}' \
            --set 'watchNamespaces={team-a}' \
            --set 'instances.prod.host=prod.rds.amazonaws.com' \
            --set 'instances.prod.credentialsSecretRef.name=prod-super'
      - name: Render the dashboard's ingress
        run: |
          helm template test charts/pg-operator --namespace pg-operator \
            --set ui.ingress.enabled=true \
            --set networkPolicy.enabled=true
      - name: Refuse a dashboard with no API to proxy to
        run: |
          if helm template test charts/pg-operator --namespace pg-operator \
               --set api.enabled=false >/dev/null 2>&1; then
            echo "ui.enabled without api.enabled should have failed to render"
            exit 1
          fi
      - name: Validate manifests against the Kubernetes schema
        uses: instrumenta/kubeval-action@master
        continue-on-error: true
        with:
          files: charts/pg-operator/crds

  image:
    # Build and smoke-test only — nothing is published here. Publishing lives
    # in image-push, which waits on lint, test, ui and chart, so a red check
    # can never put an image in the registry.
    #
    # One native runner per architecture rather than one runner emulating the
    # other: a uv sync and a vite build under QEMU cost far more than the
    # extra job, and building natively means the smoke tests below actually
    # exercise the arm64 image instead of only the amd64 one.
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4

      - name: Build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          push: false
          load: true
          tags: pg-operator:ci
          cache-from: type=gha,scope=operator-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=operator-${{ matrix.arch }}
      - name: Both entrypoints resolve as non-root
        run: |
          docker run --rm --user 65532:65532 pg-operator:ci \
            python -c "import pg_operator.operator, pg_operator.api.main; print('ok')"
          docker run --rm --user 65532:65532 pg-operator:ci kopf --version
      - name: Build the dashboard image
        uses: docker/build-push-action@v7
        with:
          context: ui
          platforms: linux/${{ matrix.arch }}
          push: false
          load: true
          tags: pg-operator-ui:ci
          cache-from: type=gha,scope=ui-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=ui-${{ matrix.arch }}

      - name: The dashboard serves read-only as uid 65532
        run: |
          docker run -d --name ui --read-only --user 65532:65532 \
            --tmpfs /tmp -p 8081:8081 pg-operator-ui:ci
          for i in $(seq 1 20); do
            curl -sf http://localhost:8081/nginx-healthz && break
            sleep 1
          done
          curl -sf http://localhost:8081/nginx-healthz
          curl -s http://localhost:8081/ | grep -q '<div id="root"></div>'
          # A deep link must survive a reload via the SPA fallback...
          test "$(curl -s -o /dev/null -w '%{http_code}' \
            http://localhost:8081/databases/team-a/orders)" = "200"
          # ...while a missing asset must still be a 404, not index.html.
          test "$(curl -s -o /dev/null -w '%{http_code}' \
            http://localhost:8081/assets/missing.js)" = "404"
          # No API in this container, so a proxied path must fail as a proxy.
          test "$(curl -s -o /dev/null -w '%{http_code}' \
            http://localhost:8081/api/v1/overview)" = "502"
          docker rm -f ui

      - name: The API serves liveness without a cluster
        run: |
          docker run -d --name api -p 8000:8000 pg-operator:ci pg-operator-api
          for i in $(seq 1 20); do
            curl -sf http://localhost:8000/healthz && break
            sleep 1
          done
          # Readiness must report the reason rather than crash-looping.
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8000/readyz)" = "503"
          docker rm -f api

  # --- publish ----
  # Gated on every check in the workflow, so nothing reaches the registry
  # unless lint, the PostgreSQL matrix, the dashboard and the chart all pass
  # and both architectures built and smoke-tested cleanly.
  #
  # Each runner pushes an untagged, single-arch image and reports its digest;
  # image-manifest joins the two into one tagged manifest list, so a tag never
  # points at a half-published pair. The build here is the same one image
  # already did, restored from the shared gha cache scope.
  image-push:
    needs: [lint, test, ui, chart, image]
    if: github.event_name != 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4

      - name: Labels for the operator image
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          labels: |
            org.opencontainers.image.title=pg-operator
            org.opencontainers.image.description=Kubernetes operator for external PostgreSQL (RDS) instances

      - name: Labels for the dashboard image
        id: meta-ui
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.UI_IMAGE_NAME }}
          labels: |
            org.opencontainers.image.title=pg-operator-ui
            org.opencontainers.image.description=Dashboard for the pg-operator state API

      - name: Log in to ${{ env.REGISTRY }}
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push the operator image
        id: push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=operator-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=operator-${{ matrix.arch }}

      - name: Push the dashboard image
        id: push-ui
        uses: docker/build-push-action@v7
        with:
          context: ui
          platforms: linux/${{ matrix.arch }}
          labels: ${{ steps.meta-ui.outputs.labels }}
          outputs: type=image,name=${{ env.REGISTRY }}/${{ env.UI_IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=ui-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=ui-${{ matrix.arch }}

      - name: Record the digests
        env:
          OPERATOR_DIGEST: ${{ steps.push.outputs.digest }}
          UI_DIGEST: ${{ steps.push-ui.outputs.digest }}
        run: |
          mkdir -p "${RUNNER_TEMP}/digests/operator" "${RUNNER_TEMP}/digests/ui"
          touch "${RUNNER_TEMP}/digests/operator/${OPERATOR_DIGEST#sha256:}"
          touch "${RUNNER_TEMP}/digests/ui/${UI_DIGEST#sha256:}"

      - name: Upload the digests
        uses: actions/upload-artifact@v7
        with:
          name: digests-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests
          if-no-files-found: error
          retention-days: 1

  image-manifest:
    needs: image-push
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      # The tags live on the manifest list, so its annotations do too: the
      # default (manifest) would put them on the per-arch children instead.
      DOCKER_METADATA_ANNOTATIONS_LEVELS: index
    steps:
      - name: Collect the per-architecture digests
        uses: actions/download-artifact@v8
        with:
          pattern: digests-*
          merge-multiple: true
          path: ${{ runner.temp }}/digests

      - uses: docker/setup-buildx-action@v4

      - name: Tags and annotations for the operator image
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=long
            type=raw,value=latest,enable={{is_default_branch}}
          labels: |
            org.opencontainers.image.title=pg-operator
            org.opencontainers.image.description=Kubernetes operator for external PostgreSQL (RDS) instances

      - name: Tags and annotations for the dashboard image
        id: meta-ui
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.UI_IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=long
            type=raw,value=latest,enable={{is_default_branch}}
          labels: |
            org.opencontainers.image.title=pg-operator-ui
            org.opencontainers.image.description=Dashboard for the pg-operator state API

      - name: Log in to ${{ env.REGISTRY }}
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push the operator manifest list
        working-directory: ${{ runner.temp }}/digests/operator
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          TAGS: ${{ steps.meta.outputs.tags }}
          ANNOTATIONS: ${{ steps.meta.outputs.annotations }}
        run: |
          args=()
          while IFS= read -r tag; do
            if [ -n "$tag" ]; then args+=(--tag "$tag"); fi
          done <<< "$TAGS"
          while IFS= read -r annotation; do
            if [ -n "$annotation" ]; then args+=(--annotation "$annotation"); fi
          done <<< "$ANNOTATIONS"
          for digest in *; do args+=("${IMAGE}@sha256:${digest}"); done
          docker buildx imagetools create "${args[@]}"

      - name: Push the dashboard manifest list
        working-directory: ${{ runner.temp }}/digests/ui
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.UI_IMAGE_NAME }}
          TAGS: ${{ steps.meta-ui.outputs.tags }}
          ANNOTATIONS: ${{ steps.meta-ui.outputs.annotations }}
        run: |
          args=()
          while IFS= read -r tag; do
            if [ -n "$tag" ]; then args+=(--tag "$tag"); fi
          done <<< "$TAGS"
          while IFS= read -r annotation; do
            if [ -n "$annotation" ]; then args+=(--annotation "$annotation"); fi
          done <<< "$ANNOTATIONS"
          for digest in *; do args+=("${IMAGE}@sha256:${digest}"); done
          docker buildx imagetools create "${args[@]}"

      - name: Both tags resolve on amd64 and arm64
        env:
          OPERATOR: ${{ steps.meta.outputs.version }}
          UI: ${{ steps.meta-ui.outputs.version }}
        run: |
          for image in \
            "${REGISTRY}/${IMAGE_NAME}:${OPERATOR}" \
            "${REGISTRY}/${UI_IMAGE_NAME}:${UI}"; do
            platforms=$(docker buildx imagetools inspect --raw "$image" \
              | jq -r '.manifests[]
                       | select(.platform.os == "linux")
                       | select(.platform.architecture != "unknown")
                       | .platform.architecture' | sort -u)
            echo "$image: $(tr '\n' ' ' <<< "$platforms")"
            grep -qx amd64 <<< "$platforms"
            grep -qx arm64 <<< "$platforms"
          done

      - name: Summarise what was published
        env:
          OPERATOR_TAGS: ${{ steps.meta.outputs.tags }}
          UI_TAGS: ${{ steps.meta-ui.outputs.tags }}
        run: |
          {
            echo "### Images published to ${REGISTRY}"
            echo
            echo "linux/amd64, linux/arm64"
            echo
            echo '```'
            printf '%s\n' "$OPERATOR_TAGS" "$UI_TAGS"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
