---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pg16
  namespace: pg-instances
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pg16
  template:
    metadata:
      labels:
        app: pg16
        pg-major: "16"
      annotations:
        # `kubectl exec deploy/pg16` (verify.sh, the README) means the server.
        kubectl.kubernetes.io/default-container: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          args: ["-c", "max_connections=200", "-c", "wal_level=logical"]
          env:
            - name: POSTGRES_PASSWORD
              value: rootpw
            - name: POSTGRES_DB
              value: postgres
          ports:
            - containerPort: 5432
          volumeMounts:
            - name: bootstrap
              mountPath: /docker-entrypoint-initdb.d
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "postgres"]
            initialDelaySeconds: 3
            periodSeconds: 3
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { memory: 512Mi }
        - name: rds-replication-shim
          # Test-only; see the rds-replication-shim ConfigMap.
          image: postgres:16-alpine
          command: ["/bin/sh", "-c"]
          args:
            - |
              until pg_isready -q -h 127.0.0.1 -U postgres; do sleep 1; done
              while true; do
                psql -q -h 127.0.0.1 -U postgres -d postgres \
                  -f /shim/rds-replication-shim.sql || true
                sleep 2
              done
          env:
            - name: PGPASSWORD
              value: rootpw
          volumeMounts:
            - name: shim
              mountPath: /shim
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits: { memory: 64Mi }
      volumes:
        - name: bootstrap
          configMap:
            name: rds-bootstrap
        - name: shim
          configMap:
            name: rds-replication-shim
