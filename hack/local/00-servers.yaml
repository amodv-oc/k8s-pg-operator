# Five PostgreSQL servers in-cluster, each bootstrapped to look like RDS:
# the managing role is a member of rds_superuser with CREATEDB and CREATEROLE,
# but is NOT a superuser. Storage is ephemeral - these exist to be reconciled
# against, not to keep data.
#
# 16, 17 and 18 run wal_level=logical and carry the rds_replication shim, so
# they can replicate between each other; 14 and 15 stay at the default, which
# is below what replication supports anyway and exercises the instance's
# "wal_level is replica" report.
apiVersion: v1
kind: Namespace
metadata:
  name: pg-instances
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: rds-bootstrap
  namespace: pg-instances
data:
  # hack/rds-like.sql, verbatim (tests/test_harness.py keeps the copies equal).
  10-rds-like.sql: |
    -- Bootstraps a stock PostgreSQL server so its managing role looks like the RDS
    -- master user: a member of rds_superuser with CREATEDB and CREATEROLE, but not a
    -- superuser, and holding neither REPLICATION nor BYPASSRLS. Run once, as the
    -- container superuser, by `make test-setup` and by CI.
    --
    -- hack/local/00-servers.yaml embeds this file verbatim and adds GRANT SET ON
    -- PARAMETER in a second script. That grant is deliberately absent here: the
    -- integration suite needs a server that still refuses a superuser-only GUC.

    CREATE ROLE rds_superuser NOLOGIN;
    CREATE ROLE pgadmin LOGIN PASSWORD 'adminpw' CREATEDB CREATEROLE;
    GRANT rds_superuser TO pgadmin;

    -- RDS makes rds_superuser a member of pg_monitor, which is what lets the
    -- master user read other roles' rows in pg_stat_replication.
    GRANT pg_monitor TO rds_superuser;

    -- On RDS, membership of rds_replication lets a login stream from a slot, and
    -- rds_superuser holds it WITH ADMIN OPTION so the master user can grant it. A
    -- stock server only honours the REPLICATION attribute, so here the role exists
    -- for grants to be issued and read back, and hack/rds-replication-shim.sql
    -- confers the attribute on its direct LOGIN members.
    CREATE ROLE rds_replication NOLOGIN;
    GRANT rds_replication TO rds_superuser WITH ADMIN OPTION;

    -- RDS lets its master user create subscriptions; PostgreSQL 16 added
    -- pg_create_subscription as the stock equivalent. There is none before 16.
    DO $$
    BEGIN
      IF current_setting('server_version_num')::int >= 160000 THEN
        EXECUTE 'GRANT pg_create_subscription TO rds_superuser';
      END IF;
    END $$;

  20-set-parameter.sql: |
    -- Cluster harness only. RDS lets its master user set logging GUCs that are
    -- superuser-only on a stock server. PostgreSQL 15 added GRANT ... ON PARAMETER,
    -- which is the closest stock equivalent; on 14 there is no such mechanism, so
    -- that server exercises the operator's "parameter refused" path instead. The
    -- integration suite leaves this out on purpose: it needs a server that refuses.
    DO $$
    BEGIN
      IF current_setting('server_version_num')::int >= 150000 THEN
        EXECUTE 'GRANT SET ON PARAMETER log_min_duration_statement TO pgadmin';
      END IF;
    END $$;

---
# Test-only: emulates RDS's rds_replication rule, run in a loop by a sidecar on
# the servers that support replication. hack/rds-replication-shim.sql, verbatim.
apiVersion: v1
kind: ConfigMap
metadata:
  name: rds-replication-shim
  namespace: pg-instances
data:
  rds-replication-shim.sql: |
    -- Emulates RDS's rds_replication rule on a stock server. Test-only; run as the
    -- container superuser.
    --
    -- On RDS a login granted rds_replication may open a walsender connection and
    -- stream from a slot. Stock PostgreSQL checks only the REPLICATION attribute,
    -- which a non-superuser managing role cannot confer, so this gives it to every
    -- LOGIN role that is a *direct* member of rds_replication.
    --
    -- Direct only: the managing role is an indirect member through rds_superuser,
    -- exactly as on RDS, and must keep NOREPLICATION - otherwise the harness would
    -- hide the "ALTER ROLE ... NOREPLICATION is refused" class of bug.
    --
    -- Revocation is not emulated: a login that leaves rds_replication keeps the
    -- attribute until it is dropped.
    DO $$
    DECLARE
      login name;
    BEGIN
      FOR login IN
        SELECT m.rolname
          FROM pg_auth_members am
          JOIN pg_roles g ON g.oid = am.roleid AND g.rolname = 'rds_replication'
          JOIN pg_roles m ON m.oid = am.member
         WHERE m.rolcanlogin AND NOT m.rolreplication AND NOT m.rolsuper
      LOOP
        EXECUTE format('ALTER ROLE %I REPLICATION', login);
        RAISE NOTICE 'emulated rds_replication: % now has REPLICATION', login;
      END LOOP;
    END $$;

---
apiVersion: v1
kind: Service
metadata:
  name: pg14
  namespace: pg-instances
spec:
  selector:
    app: pg14
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pg14
  namespace: pg-instances
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pg14
  template:
    metadata:
      labels:
        app: pg14
        pg-major: "14"
    spec:
      containers:
        - name: postgres
          image: postgres:14-alpine
          args: ["-c", "max_connections=200"]
          env:
            - name: POSTGRES_PASSWORD
              value: rootpw
            - name: POSTGRES_DB
              value: postgres
          ports:
            - containerPort: 5432
          volumeMounts:
            - name: bootstrap
              mountPath: /docker-entrypoint-initdb.d
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "postgres"]
            initialDelaySeconds: 3
            periodSeconds: 3
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { memory: 512Mi }
      volumes:
        - name: bootstrap
          configMap:
            name: rds-bootstrap
---
