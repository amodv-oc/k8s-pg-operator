# One PostgresInstance per server. Cluster-scoped: registered once by the
# platform team, referenced by name from application namespaces.
apiVersion: v1
kind: Namespace
metadata:
  name: pg-operator
---
apiVersion: v1
kind: Namespace
metadata:
  name: team-a
---
apiVersion: v1
kind: Secret
metadata:
  name: pg14-superuser
  namespace: pg-operator
type: Opaque
stringData:
  username: pgadmin
  password: adminpw
---
apiVersion: postgres.ourcommunity.com.au/v1alpha1
kind: PostgresInstance
metadata:
  name: pg14
spec:
  host: pg14.pg-instances.svc.cluster.local
  port: 5432
  credentialsSecretRef:
    name: pg14-superuser
    namespace: pg-operator
  # In-cluster plaintext: these servers have no TLS configured.
  sslMode: disable
  retentionPolicy: RETAIN
  minServerVersion: 14
  allowedNamespaces:
    - team-a
---
