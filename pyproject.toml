[project]
name = "pg-operator"
version = "0.1.0"
description = "Kubernetes operator that manages databases, roles and grants on external PostgreSQL (RDS) instances"
readme = "README.md"
requires-python = ">=3.14"
license = { text = "Apache-2.0" }
dependencies = [
    "kopf>=1.44.6",
    "kubernetes-asyncio>=36.1.0",
    "psycopg[binary,pool]>=3.3.5",
    "pydantic>=2.13.5",
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.52.4",
    "prometheus-client>=0.21.0",
    "python-json-logger>=4.2.0",
]

[project.scripts]
pg-operator-api = "pg_operator.api.__main__:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.4.0",
    "pytest-asyncio>=1.0.0",
    "pytest-cov>=7.0.0",
    "ruff>=0.12.0",
    "mypy>=1.15.0",
    "httpx>=0.28.0",
]

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "pg_operator"
module-root = "src"

[tool.ruff]
line-length = 100
target-version = "py314"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "BLE", "C4", "SIM", "RUF", "ASYNC", "S"]
ignore = ["S101", "N818"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106", "S108"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "-q"

[tool.mypy]
python_version = "3.14"
packages = ["pg_operator"]
mypy_path = "src"
warn_unused_ignores = true
disallow_untyped_defs = false
ignore_missing_imports = true
