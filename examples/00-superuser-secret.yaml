# The credentials the operator uses to manage everything else on the instance.
#
# On RDS this is the master user created with the DB instance. It is not a real
# superuser: it is a member of rds_superuser and holds CREATEDB and CREATEROLE,
# which is what the operator is built against.
#
# Create it out-of-band rather than committing it:
#
#   kubectl -n pg-operator create secret generic prod-rds-superuser \
#     --from-literal=username=postgres \
#     --from-literal=password="$(aws secretsmanager get-secret-value \
#         --secret-id rds/prod/master --query SecretString --output text \
#         | jq -r .password)"
#
# Or have external-secrets materialise it, which keeps the password out of
# Kubernetes-declared state entirely:
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: prod-rds-superuser
  namespace: pg-operator
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secretsmanager
    kind: ClusterSecretStore
  target:
    name: prod-rds-superuser
    creationPolicy: Owner
  data:
    - secretKey: username
      remoteRef:
        key: rds/prod/master
        property: username
    - secretKey: password
      remoteRef:
        key: rds/prod/master
        property: password
